name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q src
      - name: Verify frozen analysis
        if: ${{ hashFiles('results/frozen/benchmark_episodes_final.jsonl') != '' }}
        env:
          FDE_EPISODES: results/frozen/benchmark_episodes_final.jsonl
        run: python -m fde_research.verify_results
